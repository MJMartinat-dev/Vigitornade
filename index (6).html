<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="VIGITORNADE — Surveillance tornadique France en temps réel. Données IGN et Open-Meteo." />
  <meta name="theme-color" content="#080c15" />
  <title>VIGITORNADE — Surveillance tornadique France</title>
  <link rel="preconnect" href="https://api.open-meteo.com" />
  <link rel="preconnect" href="https://geo.api.gouv.fr" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%AA%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #080c15; color: #eceff1; font-family: 'Inter', system-ui, sans-serif; }
    #root { min-height: 100vh; }
    @keyframes pls { 0%, 100% { opacity: .4; r: 16; } 50% { opacity: .1; r: 24; } }
    @keyframes dsh { to { stroke-dashoffset: 0; } }
    @keyframes sweep { to { transform: rotate(360deg); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    @keyframes fi { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes sp { to { transform: rotate(360deg); } }
    button { font-family: inherit; cursor: pointer; }
    input[type=range] { -webkit-appearance: none; background: rgba(255,255,255,.08); height: 4px; border-radius: 2px; outline: none; width: 100%; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #ff6d00; cursor: pointer; border: 2px solid #080c15; }
    input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #ff6d00; cursor: pointer; border: 2px solid #080c15; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,.02); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.jsx"></script>
</body>
</html>
